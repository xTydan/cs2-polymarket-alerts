name: Validate CS2 Radar
"on":
  pull_request:
    paths:
      - 'hltv_*.py'
      - 'build_dashboard.py'
      - 'github_state.py'
      - 'tests/**'
      - '.github/workflows/validate.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Python syntax
        run: python -m py_compile hltv_matches.py hltv_results.py build_dashboard.py github_state.py
      - name: Unit tests
        run: python -m unittest discover -s tests -q
