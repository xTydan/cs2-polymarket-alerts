name: CS2 Polymarket Radar

# Zadanie co 5 minut uruchamia cron-job.org poprzez GitHub API.
# Brak 'schedule', aby nie dublowac skanow.
"on":
  workflow_dispatch:
    inputs:
      test_telegram:
        description: 'Tylko wyslij wiadomosc testowa do Telegrama'
        type: boolean
        default: false
        required: false

permissions:
  actions: read
  contents: read

concurrency:
  group: cs2-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Zainstaluj Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Zainstaluj biblioteki
        run: pip install -r requirements.txt

      - name: Testy parsera HLTV i radaru
        run: python -m unittest discover -s tests -q

      - name: Odtworz poprzedni stan
        if: ${{ inputs.test_telegram != true }}
        run: python github_state.py restore

      - name: Skanuj Polymarket lub przetestuj Telegram
        run: |
          if [ "${{ inputs.test_telegram }}" = "true" ]; then
            python radar.py --test-alert
          else
            python radar.py --once
          fi

      - name: Zbuduj panel historii
        if: ${{ success() && inputs.test_telegram != true }}
        run: python build_dashboard.py

      - name: Zapisz stan
        if: ${{ success() && inputs.test_telegram != true }}
        run: python github_state.py backup

      - name: Przechowuj stan do kolejnego skanu
        if: ${{ success() && inputs.test_telegram != true }}
        uses: actions/upload-artifact@v4
        with:
          name: radar-state
          path: state/
          retention-days: 2
          if-no-files-found: error

      - name: Skonfiguruj GitHub Pages
        if: ${{ success() && inputs.test_telegram != true }}
        uses: actions/configure-pages@v5

      - name: Wyslij strone do GitHub Pages
        if: ${{ success() && inputs.test_telegram != true }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: public/

  deploy:
    name: Opublikuj panel
    needs: scan
    if: ${{ needs.scan.result == 'success' && inputs.test_telegram != true }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Opublikuj na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
