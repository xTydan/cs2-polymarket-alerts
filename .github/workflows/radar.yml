
name: CS2 Polymarket Radar

"on":
  schedule:
    # Automatyczne skanowanie co 5 minut
    - cron: '4-59/5 * * * *'

  workflow_dispatch:
    inputs:
      test_telegram:
        description: 'Tylko wyslij wiadomosc testowa do Telegrama'
        type: boolean
        default: false
        required: false

permissions:
  actions: read
  contents: read

concurrency:
  group: cs2-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Zainstaluj Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Zainstaluj biblioteki
        run: pip install -r requirements.txt

      - name: Odtworz poprzedni stan
        if: ${{ inputs.test_telegram != true }}
        run: python github_state.py restore

      - name: Skanuj Polymarket lub przetestuj Telegram
        run: |
          if [ "${{ inputs.test_telegram }}" = "true" ]; then
            python radar.py --test-alert
          else
            python radar.py --once
          fi

      - name: Zapisz stan
        if: ${{ always() && inputs.test_telegram != true }}
        run: python github_state.py backup

      - name: Przechowuj stan do kolejnego skanu
        if: ${{ always() && inputs.test_telegram != true }}
        uses: actions/upload-artifact@v4
        with:
          name: radar-state
          path: state/
          retention-days: 1
          if-no-files-found: ignore
